<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Layout</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            display: flex;         
            justify-content: center;
            background-color: #F8FAFC;
            font-family:'Gill Sans', 'Gill Sans MT', sans-serif;
            padding: 20px;
        }
        .principal{
            display: grid;
            max-width: 1140px;
            width: 100%;
            grid:
                "header header" minmax(100px, auto)
                "aside content" minmax(740px, auto)
                "footer footer" minmax(100px, auto)
                / minmax(100px, 260px) 1fr;
            /* padding: 20px; */
            border: 1px solid rgb(189, 189, 189);
        }
        .header{
            grid-area: header;
            background-color: rgb(158, 225, 241);
            border-bottom: 1px solid rgb(189, 189, 189);
        }
        .menu-lateral{
            grid-area: aside;
            background-color: rgb(143, 185, 143);
        }
        .conteudo{
            grid-area: content;
            background-color:rgb(202, 188, 148);
            border-right: 1px solid rgb(189, 189, 189);
        }
        .rodape{
            grid-area: footer;
            background-color:rgb(217, 181, 231);
            border-top: 1px solid rgb(189, 189, 189);
        }

        .item-grid{
            padding: 20px;
        }

        @media (max-width:767px){
            .principal{
                grid: 
                "header header" minmax(60px, auto)
                "aside aside" minmax(60px, auto)
                "content content" 1fr
                "footer footer" 60px
                / 1fr;
                padding: 0px;
            }
            .conteudo{
                height: 70vh;
            }
        }
    </style>
</head>
<body>
    <!--
        Crie um layout para um portal de notícias utilizando grid-template-areas, 
        contendo: Cabeçalho, Menu Lateral, Área Principal de Notícias e Rodapé.
    -->

    <div class="principal">
        <header class="item-grid header">Cabeçalho</header>
        <aside class="item-grid menu-lateral">Menu Lateral</aside>
        <main class="item-grid conteudo">Área Principal de Notícias</main>
        <footer class="item-grid rodape">Rodapé</footer>
    </div>
    
</body>
</html>
