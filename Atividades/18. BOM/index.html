<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../logo-ifsul.png" />
    <title>JavaScript Browser Object Model</title>
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.js" defer></script>
  </head>
  <body>
    <!-- Botão para abrir o modal -->
    <button open id="btnAbrirModal">Inserir dados</button>

    <!-- Estrutura do Dialog -->
    <dialog id="modalFormulario">
      <div class="conteudo">
        <!-- Botão para fechar o modal -->
        <span class="btnFecharModal topo"></span>

        <!-- Titulo modal -->
        <h2>Formulario de Entrada de Dados</h2>

        <!-- Formulario -->
        <form id="formulario" action="#" method="dialog">
          <div class="campo">
            <label for="usuario">Nome de Usuário</label>
            <input
              type="text"
              name="usuario"
              id="usuario"
              autocomplete="name"              
            />
          </div>
          <div class="campo">
            <label for="telefone">Telefone</label>
            <input
              type="tel"
              name="telefone"
              id="telefone"
              autocomplete="tel"
              
            />
          </div>
          <div class="campo">
            <label for="senha">Senha</label>
            <input
              type="password"
              name="senha"
              id="senha"
              minlength="6"
              maxlength="12"
              autocomplete="new-password"
              
            />
          </div>
          <div class="campo">
            <label for="perfil">@Perfil na Rede Social</label>
            <input
              type="text"
              name="perfil"
              id="perfil"
              autocomplete="url"
              
            />
          </div>
          <div class="campo">
            <label for="categoria-profissional">Categoria Profissional</label>
            <select
              name="categoria-profissional"
              id="categoria-profissional"
              
              autocomplete="organization-title"
            >
              <option value="" disabled selected>Selecione...</option>
              <option value="servidor-publico">Servidor Público</option>
              <option value="comerciario">Comerciário</option>
              <option value="industriario">Industriário</option>
              <option value="terceiro-setor">Terceiro Setor</option>
            </select>
          </div>
          <div class="campo">
            <label for="data-nascimento">Data Nascimento</label>
            <input
              type="date"
              name="data-nascimento"
              id="data-nascimento"
              autocomplete="bday"
              
            />
          </div>
          <div class="campo">
            <fieldset>
              <label for="faixa-valor">Faixa de Valor</label>
            <input
              type="range"
              name="faixa-valor"
              id="faixa-valor"
              min="0"
              value="0"
              max="10000"
              step="50"
              autocomplete="billing"
              
            />
            <output id="valor"></output>
            </fieldset>
          </div>
          <div class="campo canal">
            <fieldset>
            <label class="titulo-radio">Preferência de canal de contato:</label>
            <div class="opcao-canal">
              <input
                type="radio"
                name="canal-contato"
                id="contato-telefone"
                value="telefone"
                
              />
              <label for="contato-telefone">Telefone</label>
            </div>    
            <div class="opcao-canal">
              <input
                type="radio"
                name="canal-contato"
                id="contato-whatsapp"
                value="whatsapp"
                
              />
              <label for="contato-whatsapp">WhatsApp</label>
            </div>      
            <div class="opcao-canal">
            <input
              type="radio"
              name="canal-contato"
              id="contato-rede-social"
              value="direct rede social"
              
            />
              <label for="contato-rede-social">Direct Rede Social</label>
          </div>      
          </div>
        </fieldset>
          <!-- <div class="campo">
            <label for="mensagem">Mensagem</label>
            <textarea name="mensagem" id="mensagem" rows="2" ></textarea>
          </div> -->
          <div class="campo aceite">
            <input type="checkbox" name="aceite" id="aceite"  />
            <label for="aceite"
              >Ao clicar em enviar você aceita nosso termos e condições.</label
            >
          </div>
          <input id="enviar" type="submit" value="Enviar Dados" />
          <input id="limpar" type="reset" value="Limpar Campos" />
        </form>
        <div class="btnFecharModal base">Fechar</div>
      </div>
    </dialog>
    <div class="dados-enviados oculto">
      <h2>Dados Enviados</h2>
      <div class="infos"></div>
    </div>
  </body>
</html>
